name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dentaliq_test
          POSTGRES_USER: dentaliq
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dentaliq -d dentaliq_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests
        env:
          # conftest.py defaults to a temporary SQLite file; the postgres leg overrides it.
          TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg2://dentaliq:ci-only-password@localhost:5432/dentaliq_test' || '' }}
        run: python -m pytest -q

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: JWT_SECRET=ci POSTGRES_PASSWORD=ci docker compose config --quiet
      - name: Build images
        run: JWT_SECRET=ci POSTGRES_PASSWORD=ci docker compose build
